name: 🚀 Deploy – Đề 19 News Website

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Kiểm tra code (lint & validate)
  # ─────────────────────────────────────────────
  validate:
    name: 🔍 Validate Config Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Validate Nginx config
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/nginx:/etc/nginx:ro \
            nginx:1.25-alpine nginx -t

      - name: Validate Prometheus config
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/prometheus:/etc/prometheus:ro \
            prom/prometheus:v2.52.0 \
            promtool check config /etc/prometheus/prometheus.yml

      - name: Check .env.example exists
        run: |
          if [ ! -f ".env" ] && [ ! -f ".env.example" ]; then
            echo "❌ Thiếu file .env hoặc .env.example"
            exit 1
          fi
          echo "✅ Config files OK"

  # ─────────────────────────────────────────────
  # Job 2: Security scan
  # ─────────────────────────────────────────────
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan with Trivy (Docker images)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'        # Chưa fail CI, chỉ warn
          severity: 'HIGH,CRITICAL'

      - name: Check hardcoded secrets
        run: |
          # Kiểm tra không có password hardcode trong code
          if grep -rn "password\s*=\s*['\"][^$]" \
             --include="*.php" --include="*.js" \
             --exclude-dir=".git" . 2>/dev/null | grep -v "example"; then
            echo "⚠️  Phát hiện có thể có password hardcode – hãy kiểm tra!"
          else
            echo "✅ Không phát hiện hardcode secrets"
          fi

  # ─────────────────────────────────────────────
  # Job 3: Deploy lên server (chỉ khi push main)
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Server
    runs-on: ubuntu-latest
    needs: [validate, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: http://${{ secrets.SERVER_IP }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'ENDSSH'
            set -e
            echo "📥 Pulling latest code..."
            cd /opt/de19-news-website
            git pull origin main

            echo "🔄 Restarting services..."
            docker compose pull
            docker compose up -d --remove-orphans

            echo "🧹 Cleanup old images..."
            docker image prune -f

            echo "✅ Deploy hoàn thành!"
            docker compose ps
          ENDSSH

      - name: Health Check
        run: |
          sleep 15
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://${{ secrets.SERVER_IP }})
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Health check thất bại! HTTP status: $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Website đang hoạt động tốt (HTTP $HTTP_STATUS)"

      - name: Notify deploy result
        if: always()
        run: |
          echo "Deploy result: ${{ job.status }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
