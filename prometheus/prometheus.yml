global:
  scrape_interval: 15s       # Thu thập metrics mỗi 15 giây
  evaluation_interval: 15s   # Đánh giá rules mỗi 15 giây
  scrape_timeout: 10s

  external_labels:
    project: 'de19-news-website'
    env: 'production'

# ── Alerting rules ──
rule_files:
  - /etc/prometheus/rules/*.yml

# ── Scrape jobs ──
scrape_configs:

  # Prometheus tự monitor chính nó
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter – metrics CPU, RAM, Disk, Network
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'de19-server'

  # cAdvisor – metrics từng container Docker
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Nginx – dùng nginx-prometheus-exporter (nếu cài thêm)
  # - job_name: 'nginx'
  #   static_configs:
  #     - targets: ['nginx-exporter:9113']

  # Loki – self-monitoring
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
