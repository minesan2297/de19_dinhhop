version: "3.9"

# ============================================================
#  ĐỀ 19 – Website Tin tức / Cổng thông tin
#  Stack: WordPress + MySQL + phpMyAdmin + Nginx +
#         Prometheus + Grafana + Loki + Promtail
# ============================================================

networks:
  frontend:        # Nginx <-> App
  backend:         # App <-> DB
  monitoring:      # Prometheus / Loki / Grafana

volumes:
  mysql_data:
  wordpress_data:
  prometheus_data:
  grafana_data:
  loki_data:

services:

  # ─────────────────────────────────────────────
  # 1. MYSQL DATABASE
  # ─────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: de19_mysql
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    # Không expose ra ngoài – chỉ nội bộ
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # 2. PHPMYADMIN
  # ─────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: de19_phpmyadmin
    restart: unless-stopped
    env_file: .env
    environment:
      PMA_HOST: ${PMA_HOST}
      PMA_PORT: ${PMA_PORT}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend
      - frontend
    # Không expose port trực tiếp – đi qua Nginx

  # ─────────────────────────────────────────────
  # 3. WORDPRESS
  # ─────────────────────────────────────────────
  wordpress:
    image: wordpress:6.5-php8.2-fpm
    container_name: de19_wordpress
    restart: unless-stopped
    env_file: .env
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/wp-content:/var/www/html/wp-content
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend
      - frontend

  # ─────────────────────────────────────────────
  # 4. NGINX REVERSE PROXY  ← cổng duy nhất ra ngoài
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: de19_nginx
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP (WordPress + phpMyAdmin)
      - "3000:3000"   # Grafana dashboard
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - wordpress_data:/var/www/html:ro
      - /var/log/nginx:/var/log/nginx   # cho Promtail đọc log
    depends_on:
      - wordpress
      - phpmyadmin
    networks:
      - frontend
      - monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ─────────────────────────────────────────────
  # 5. NODE EXPORTER (metrics hệ thống)
  # ─────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: de19_node_exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring

  # ─────────────────────────────────────────────
  # 6. CADVISOR (metrics container)
  # ─────────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: de19_cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - monitoring

  # ─────────────────────────────────────────────
  # 7. PROMETHEUS
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: de19_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
    depends_on:
      - node-exporter
      - cadvisor

  # ─────────────────────────────────────────────
  # 8. LOKI (log aggregation)
  # ─────────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: de19_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - monitoring

  # ─────────────────────────────────────────────
  # 9. PROMTAIL (thu thập log → Loki)
  # ─────────────────────────────────────────────
  promtail:
    image: grafana/promtail:3.0.0
    container_name: de19_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/log/nginx:/var/log/nginx:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - monitoring
    depends_on:
      - loki

  # ─────────────────────────────────────────────
  # 10. GRAFANA (dashboard)
  # ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    container_name: de19_grafana
    restart: unless-stopped
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: ${GF_USERS_ALLOW_SIGN_UP}
      GF_SERVER_HTTP_PORT: 3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring
      - frontend
    depends_on:
      - prometheus
      - loki
