# ──────────────────────────────────────────────
#  Upstream: WordPress (PHP-FPM)
# ──────────────────────────────────────────────
upstream wordpress_fpm {
    server wordpress:9000;
}

# ──────────────────────────────────────────────
#  Server: WordPress – cổng 80
# ──────────────────────────────────────────────
server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php index.html;

    # Chặn truy cập file nhạy cảm (hardening)
    location ~* /\.(htaccess|htpasswd|env|git) {
        deny all;
        return 404;
    }

    # Chặn truy cập xmlrpc.php (WordPress attack vector)
    location = /xmlrpc.php {
        deny all;
        return 403;
    }

    # Static files – cache dài
    location ~* \.(jpg|jpeg|gif|png|webp|svg|ico|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # WordPress – chuyển tiếp PHP sang FPM
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass wordpress_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Giới hạn tốc độ đăng nhập wp-login (hardening)
    location = /wp-login.php {
        limit_req zone=login burst=5 nodelay;
        fastcgi_pass wordpress_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}

# ──────────────────────────────────────────────
#  Rate limiting zone (định nghĩa ở http block)
# ──────────────────────────────────────────────
# Lưu ý: khai báo limit_req_zone phải ở trong http block (nginx.conf)
# → Đã thêm vào nginx.conf
