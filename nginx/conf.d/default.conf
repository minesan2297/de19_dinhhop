upstream wordpress_fpm {
    server de19_wordpress:9000;
}

upstream pma_backend {
    server de19_phpmyadmin:80;
}

upstream grafana_backend {
    server de19_grafana:3000;
}

# --- PORT 80: WordPress + phpMyAdmin ---
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    # Dùng ^~ để ngăn regex static .js/.css của WordPress chặn nhầm phpMyAdmin
    location ^~ /pma/ {
        proxy_pass http://pma_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* /\.(htaccess|htpasswd|env|git) {
        deny all;
        return 404;
    }

    location = /xmlrpc.php {
        deny all;
        return 403;
    }

    location ~* \.(jpg|jpeg|gif|png|webp|svg|ico|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass wordpress_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}

# --- PORT 3000: Grafana Dashboard ---
server {
    listen 3000 default_server;
    server_name _;

    location / {
        proxy_pass http://grafana_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
