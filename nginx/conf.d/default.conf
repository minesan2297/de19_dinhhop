upstream wordpress_fpm {
    server de19_wordpress:9000;
}

upstream pma_backend {
    server de19_phpmyadmin:80;
}

upstream grafana_backend {
    server de19_grafana:3000;
}

# --- PORT 80: HTTP (WordPress + phpMyAdmin) ---
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;

    # Định tuyến phpMyAdmin
    location ^~ /pma/ {
        proxy_pass http://pma_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* /\.(htaccess|htpasswd|env|git) {
        deny all;
        return 404;
    }

    location = /xmlrpc.php {
        deny all;
        return 403;
    }

    location ~* \.(jpg|jpeg|gif|png|webp|svg|ico|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

        # Rate Limiting cho trang dang nhap WordPress (Chong Brute-force)
    location = /wp-login.php {
        limit_req zone=login burst=4 nodelay;
        limit_req_status 429;

        fastcgi_pass wordpress_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ {
        fastcgi_pass wordpress_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}

# --- PORT 443: HTTPS (SSL Tự ký) ---
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/html;
    index index.php index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;

    location ^~ /pma/ {
        proxy_pass http://pma_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~* /\.(htaccess|htpasswd|env|git) {
        deny all;
        return 404;
    }

    location = /xmlrpc.php {
        deny all;
        return 403;
    }

    location ~* \.(jpg|jpeg|gif|png|webp|svg|ico|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

        # Rate Limiting cho trang dang nhap WordPress (Chong Brute-force HTTPS)
    location = /wp-login.php {
        limit_req zone=login burst=4 nodelay;
        limit_req_status 429;

        fastcgi_pass wordpress_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ {
        fastcgi_pass wordpress_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}

# --- PORT 3000: Grafana Dashboard ---
server {
    listen 3000 default_server;
    server_name _;

    location / {
        proxy_pass http://grafana_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- PORT 8080: Nginx Stub Status (Internal Metrics) ---
server {
    listen 8080 default_server;
    server_name _;

    location /stub_status {
        stub_status on;
        access_log off;
        allow all;
    }
}
